[project]
name = "bge-m3-embed"
version = "1.0.0"
description = "BGE-M3 dense-embedding HTTP service for shamela-ingest"
# torch ships no wheels for 3.14 yet (only cp310-cp313); cap below it.
requires-python = ">=3.10,<3.14"
# Deliberately NOT FlagEmbedding/sentence-transformers: both import
# datasets -> pyarrow, which segfaults on import here. transformers alone is
# enough to compute BGE-M3 dense vectors (CLS + L2-normalize).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "transformers>=4.40",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "lancedb>=0.30",
    "pandas"
]

# Pull torch from the CUDA 12.6 wheel index (matches the box's CUDA 12.6 /
# RTX 3080). Switch to cu124/cu128 — or remove this whole block for the CPU
# build — as needed. `explicit = true` means only packages routed here via
# [tool.uv.sources] use it; everything else still resolves from PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[package]
name = "bge-m3-rs"
version = "1.0.0"
edition = "2021"
description = "CPU-only BGE-M3 dense-embedding HTTP service (Rust port of serve.py)"

[[bin]]
name = "bge-m3-rs"
path = "src/main.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[dependencies]
# fastembed wraps ONNX Runtime (`ort`) + HF `tokenizers`. The default feature
# set (`ort-download-binaries-native-tls`) makes `ort` fetch the onnxruntime
# shared lib at build/first-run, so the VPS needs no system onnxruntime.
# We do NOT enable `cuda`/`metal`/`mkl`: this is a plain CPU build.
fastembed = "5.17"

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# only used by the `compare` bin to POST to the running Python service (http, localhost)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[profile.release]
opt-level = 3
lto = "thin"

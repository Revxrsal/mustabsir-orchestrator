[package]
name = "mustabsir-orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.102"
thiserror = "2.0.18"
rig = { version = "0.39.0", features = ["lancedb"] }
dotenv = "0.15.0"
dotenv_codegen = "0.15.0"

clap = { version = "4", features = ["derive"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lancedb = "0.30"
lance-index = "=7.0.0" # FullTextSearchQuery + FTS index builder; pinned to lancedb 0.30's lance
arrow = "58" # must match lancedb 0.30's arrow (58.3.0); 59 would break RecordBatch types
regex = "1" # page-body cleaning + heading-span splitting
once_cell = "1.21.4"
futures = "0.3" # collecting LanceDB query streams (context expansion + sanity test)
